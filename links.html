<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="Professional links for Mohammed Jameel — CV, LinkedIn, infographic and portfolio.">
  <title>Let's Connect | Mohammed Jameel</title>
  <link href="assets/fonts/fonts.css" rel="stylesheet" />
  <style>
    :root{color-scheme:dark;--bg:#101010;--panel:#191919;--line:#343434;--orange:#ff8a32;--text:#f5f5f5;--muted:#b8b8b8;--cardA:#292929;--cardB:#202020;--cardHover:#303030;--iconBg:#382719}
    body.light{color-scheme:light;--bg:#f6f6f7;--panel:#ffffff;--line:#e2e2e4;--orange:#c2410c;--text:#1f2937;--muted:#5b6472;--cardA:#ffffff;--cardB:#f7f7f8;--cardHover:#fff7ef;--iconBg:#ffedd5}
    /* light theme needs its own top glow — the dark #303030 gradient read as a
       dirty blob behind the toggles when body.light was active */
    body.light{background:radial-gradient(ellipse at 50% 0%,#fde8d4 0,transparent 55%),var(--bg)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:28px 16px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#303030 0,transparent 55%),var(--bg);color:var(--text);font-family:Lato,Inter,"Segoe UI",Arial,sans-serif;transition:background .25s,color .25s}
    html[lang="ar"] body{font-family:Cairo,Lato,"Segoe UI",Tahoma,Arial,sans-serif}
    main{width:min(100%,500px)}
    .panel{padding:34px 25px 25px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,var(--panel),var(--cardB));box-shadow:0 24px 70px #0008}
    body.light .panel{box-shadow:0 24px 70px #0002}
    .mark{text-align:center;color:var(--orange);font-size:12px;font-weight:800;letter-spacing:3px}
    /* QA REC #7: avatar gives the link-in-bio card an identity above the links */
    .avatar{display:block;width:92px;height:92px;margin:0 auto 16px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,138,50,.45);background:var(--cardB);box-shadow:0 12px 30px #0007}
    body.light .avatar{border-color:rgba(194,65,12,.4);box-shadow:0 10px 24px #00000022}
    html[dir="rtl"] .mark{letter-spacing:0}
    h1{text-align:center;margin:11px 0 8px;font-size:clamp(30px,7vw,38px)}
    .intro{text-align:center;color:var(--muted);margin:0 0 27px;font-size:15px}
    nav{display:grid;gap:13px}
    a.card{display:flex;align-items:center;gap:15px;min-height:76px;padding:13px 16px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(120deg,var(--cardA),var(--cardB));color:var(--text);text-decoration:none;transition:transform .18s,border-color .18s,background .18s}
    a.card:hover,a.card:focus-visible{transform:translateY(-2px);border-color:var(--orange);background:var(--cardHover);outline:none}
    .icon{width:47px;height:47px;flex:0 0 47px;border-radius:14px;display:grid;place-items:center;background:var(--iconBg);color:var(--orange);font-size:19px;font-weight:800}
    .label{flex:1;min-width:0;font-weight:750;font-size:17px}
    .hint{display:block;margin-top:4px;color:var(--muted);font-size:12px;font-weight:400}
    .arrow{font-size:25px;color:var(--orange)}
    html[dir="rtl"] .arrow{transform:scaleX(-1)}
    footer{text-align:center;margin-top:24px;color:var(--muted);font-size:11px;letter-spacing:2px}
    html[dir="rtl"] footer{letter-spacing:0;font-size:13px}
    .topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px}
    .tgl{border:1px solid var(--line);background:var(--cardB);color:var(--text);border-radius:50px;padding:7px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;min-height:36px;min-width:44px;transition:border-color .18s,color .18s}
    .tgl:hover,.tgl:focus-visible{border-color:var(--orange);color:var(--orange);outline:none}
    @media(max-width:380px){.panel{padding:28px 16px 21px}.label{font-size:15px}}
  </style>
</head>
<body>
  <script>
    /* Follow saved language + theme from the main portfolio (no flash). */
    (function () {
      try {
        var lang = localStorage.getItem('lang') || 'en';
        document.documentElement.lang = lang;
        document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
        if ((localStorage.getItem('theme') || 'dark') === 'light') {
          document.body.classList.add('light');
        }
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute('content', document.body.classList.contains('light') ? '#f6f6f7' : '#101010');
      } catch (e) { /* storage unavailable */ }
    })();
  </script>
  <main>
    <div class="topbar">
      <button id="langToggle" class="tgl" aria-label="Switch language">AR</button>
      <button id="themeToggle" class="tgl" aria-label="Switch dark/light theme">☾</button>
    </div>
    <section class="panel" aria-labelledby="page-title">
      <img class="avatar" src="assets/avatar.webp" alt="Mohammed Jameel" width="92" height="92" decoding="async" />
      <div class="mark" data-key="brand">MOHAMMED JAMEEL</div>
      <h1 id="page-title" data-key="title">Let's Connect</h1>
      <p class="intro" data-key="intro">Choose where you'd like to explore</p>
      <nav aria-label="Professional links">
        <a class="card" href="assets/Mohammed_Jameel_Fouad_CV.pdf" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">CV</span><span class="label"><span data-key="cvLabel">Download My CV</span><span class="hint" data-key="cvHint">View or download my resume</span></span><span class="arrow" aria-hidden="true">›</span>
        </a>
        <a class="card" href="https://www.linkedin.com/in/imohammedjameel/" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">in</span><span class="label"><span data-key="liLabel">Visit My LinkedIn</span><span class="hint" data-key="liHint">Connect with me professionally</span></span><span class="arrow" aria-hidden="true">›</span>
        </a>
        <a class="card" href="https://drive.google.com/file/d/1vbdSMJVTWCrSCXTwXQciBCnh2lYSSzqH/view?usp=sharing" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">▥</span><span class="label"><span data-key="infLabel">View My Infographic</span><span class="hint" data-key="infHint">Explore my professional snapshot</span></span><span class="arrow" aria-hidden="true">›</span>
        </a>
        <a class="card" href="https://imohammedjameel.github.io/" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">↗</span><span class="label"><span data-key="pfLabel">Explore My Portfolio</span><span class="hint" data-key="pfHint">Discover my projects and work</span></span><span class="arrow" aria-hidden="true">›</span>
        </a>
      </nav>
      <footer data-key="motto">BUILD · INNOVATE · TRANSFORM</footer>
    </section>
  </main>
  <script>
    var translations = {
      en: {
        title: "Let's Connect",
        brand: 'MOHAMMED JAMEEL',
        intro: "Choose where you'd like to explore",
        cvLabel: 'Download My CV', cvHint: 'View or download my resume',
        liLabel: 'Visit My LinkedIn', liHint: 'Connect with me professionally',
        infLabel: 'View My Infographic', infHint: 'Explore my professional snapshot',
        pfLabel: 'Explore My Portfolio', pfHint: 'Discover my projects and work',
        motto: 'BUILD · INNOVATE · TRANSFORM',
        docTitle: "Let's Connect | Mohammed Jameel",
        desc: 'Professional links for Mohammed Jameel — CV, LinkedIn, infographic and portfolio.'
      },
      ar: {
        title: 'لِنَتواصل',
        brand: 'محمد جميل',
        intro: 'اختر ما تود استكشافه',
        cvLabel: 'حمّل سيرتي الذاتية', cvHint: 'اعرض أو نزّل السيرة الذاتية',
        liLabel: 'زور ملفي على لينكدإن', liHint: 'تواصل معي باحترافية',
        infLabel: 'شاهد الانفوجرافيك', infHint: 'استكشف لمسة سريعة عن مسيرتي',
        pfLabel: 'استكشف معرض أعمالي', pfHint: 'اكتشف مشاريعي وأعمالي',
        motto: 'نبني · نبتكر · نطور',
        docTitle: 'لِنَتواصل | محمد جميل',
        desc: 'روابط محمد جميل المهنية — السيرة الذاتية، لينكدإن، الانفوجرافيك ومعرض الأعمال.'
      }
    };
    function applyLang(lang) {
      var t = translations[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-key]').forEach(function (el) {
        var k = el.getAttribute('data-key');
        if (t[k]) el.textContent = t[k];
      });
      document.title = t.docTitle;
      var md = document.querySelector('meta[name="description"]');
      if (md) md.setAttribute('content', t.desc);
      document.getElementById('langToggle').textContent = (lang === 'ar') ? 'EN' : 'AR';
    }
    document.getElementById('langToggle').addEventListener('click', function () {
      var lang = (document.documentElement.lang === 'ar') ? 'en' : 'ar';
      try { localStorage.setItem('lang', lang); } catch (e) {}
      applyLang(lang);
    });
    document.getElementById('themeToggle').addEventListener('click', function () {
      var light = document.body.classList.toggle('light');
      this.textContent = light ? '☀' : '☾';
      try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (e) {}
      var tc = document.querySelector('meta[name="theme-color"]');
      if (tc) tc.setAttribute('content', light ? '#f6f6f7' : '#101010');
    });
    /* sync toggle icon with applied theme */
    (function () {
      var t = document.getElementById('themeToggle');
      if (document.body.classList.contains('light')) t.textContent = '☀';
      /* apply saved language immediately (body script already set dir/lang) */
      try {
        var lang = localStorage.getItem('lang');
        if (lang) applyLang(lang);
      } catch (e) {}
    })();
  </script>
</body>
</html>
