<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="Professional links for Mohammed Jameel — CV, LinkedIn, infographic and portfolio.">
  <title>Let's Connect | Mohammed Jameel</title>
  <style>
    :root{color-scheme:dark;--bg:#101010;--panel:#191919;--line:#343434;--orange:#ff8a32;--text:#f5f5f5;--muted:#b8b8b8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:28px 16px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#303030 0,transparent 55%),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}
    main{width:min(100%,500px)}
    .panel{padding:34px 25px 25px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(145deg,#202020,#151515);box-shadow:0 24px 70px #0008}
    .mark{text-align:center;color:var(--orange);font-size:12px;font-weight:800;letter-spacing:3px}
    h1{text-align:center;margin:11px 0 8px;font-size:clamp(30px,7vw,38px)}
    .intro{text-align:center;color:var(--muted);margin:0 0 27px;font-size:15px}
    nav{display:grid;gap:13px}
    a{display:flex;align-items:center;gap:15px;min-height:76px;padding:13px 16px;border:1px solid #414141;border-radius:17px;background:linear-gradient(120deg,#292929,#202020);color:var(--text);text-decoration:none;transition:transform .18s,border-color .18s,background .18s}
    a:hover,a:focus-visible{transform:translateY(-2px);border-color:var(--orange);background:#303030;outline:none}
    .icon{width:47px;height:47px;flex:0 0 47px;border-radius:14px;display:grid;place-items:center;background:#382719;color:var(--orange);font-size:19px;font-weight:800}
    .label{flex:1;min-width:0;font-weight:750;font-size:17px}
    .hint{display:block;margin-top:4px;color:var(--muted);font-size:12px;font-weight:400}
    .arrow{font-size:25px;color:var(--orange)}
    footer{text-align:center;margin-top:24px;color:#999;font-size:11px;letter-spacing:2px}
    @media(max-width:380px){.panel{padding:28px 16px 21px}.label{font-size:15px}}
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-labelledby="page-title">
      <div class="mark">MOHAMMED JAMEEL</div>
      <h1 id="page-title">Let's Connect</h1>
      <p class="intro">Choose where you'd like to explore</p>
      <nav aria-label="Professional links">
        <a href="https://drive.google.com/file/d/1dEanJ_z0-m0vaOBEfEtM26Z8jH0COeCw/view?usp=sharing" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">CV</span><span class="label">Download My CV<span class="hint">View or download my resume</span></span><span class="arrow" aria-hidden="true">›</span>
        </a>
        <a href="https://www.linkedin.com/in/imohammedjameel/" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">in</span><span class="label">Visit My LinkedIn<span class="hint">Connect with me professionally</span></span><span class="arrow" aria-hidden="true">›</span>
        </a>
        <a href="https://drive.google.com/file/d/1vbdSMJVTWCrSCXTwXQciBCnh2lYSSzqH/view?usp=sharing" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">▥</span><span class="label">View My Infographic<span class="hint">Explore my professional snapshot</span></span><span class="arrow" aria-hidden="true">›</span>
        </a>
        <a href="https://imohammedjameel.github.io/" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">↗</span><span class="label">Explore My Portfolio<span class="hint">Discover my projects and work</span></span><span class="arrow" aria-hidden="true">›</span>
        </a>
      </nav>
      <footer>BUILD · INNOVATE · TRANSFORM</footer>
    </section>
  </main>
</body>
</html>
